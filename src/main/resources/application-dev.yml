# 本地开发：必须显式激活
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   或 SPRING_PROFILES_ACTIVE=dev
spring:
  datasource:
    # 兼容项目原有的本地 MySQL 配置；可用 DB_PASSWORD 覆盖。
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      password: ${REDIS_PASSWORD:123456}

app:
  jwt:
    # 仅开发允许固定开发密钥（A0.1）
    allow-dev-secret: true
  ai:
    # 本地联调假 LLM（http://127.0.0.1:18080/v1）；生产禁止
    allow-loopback-personal-config: true
    # Clash/TUN 常把公网域名解析到 RFC 2544 Fake-IP（198.18.0.0/15）。
    # dev 默认兼容，避免应用或终端重启后临时环境变量丢失；可显式设为 false 收紧。
    # 该例外只接受“域名解析结果”，直接填写 198.18.x.x 仍拒绝；prod 也强制为 false。
    allow-proxy-synthetic-dns: ${AI_ALLOW_PROXY_SYNTHETIC_DNS:true}
  password:
    # 开发允许明文登录并自动升级 BCrypt（A2）
    allow-plaintext-login: true
  login:
    rate-limit:
      # 开发放宽，避免联调被锁
      max-attempts: 30
      window-seconds: 300
      lock-seconds: 60
  bootstrap:
    # 开发可不强制 env 引导；演示账号见 docs/sql/dev-seed-notes.md
    initial-admin-enabled: false
  # 开发默认可自动修结构/脏数据
  schema-guard:
    auto-migrate: true
    fail-fast: false
  data-state-guard:
    auto-fix: true
  role-guard:
    auto-fix: true
