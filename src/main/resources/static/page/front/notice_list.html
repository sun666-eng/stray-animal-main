<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="查看归途计划的救助动态、领养活动与平台公告">
    <title>救助动态 · 归途计划</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%270.9em%27 font-size=%2790%27 fill=%27%23d63a1f%27>%E2%99%A5</text></svg>">
    <link rel="stylesheet" href="../../css/product-ui.css?v=20260731a">
</head>
<body>
<div id="app" v-cloak>
    <front-site-header :user="user"></front-site-header>

    <main>
        <section class="ui-page-head"><div class="ui-container"><div class="ui-breadcrumb"><a href="./index.html" style="color:inherit;text-decoration:none">首页</a><span>/</span><strong>救助动态</strong></div><div class="ui-page-head-row"><div><h1>最近发生的温暖小事</h1><p>查看救助进展、领养活动、志愿者通知和平台公开信息。</p></div><span v-if="!loading && !error" class="ui-badge is-done">{{ total }} 条公开内容</span></div></div></section>
        <section class="ui-container ui-public-section">
            <form class="ui-toolbar" role="search" @submit.prevent="loadNotices(1)"><label class="ui-search"><span>⌕</span><span class="sr-only">搜索公告</span><input v-model.trim="query" type="search" placeholder="搜索公告标题" autocomplete="off"></label><button class="ui-button is-dark" type="submit">搜索</button><button v-if="query" class="ui-button is-ghost" type="button" @click="resetQuery">清除</button></form>
            <div v-if="loading" class="ui-notice-list" aria-label="正在加载公告"><article v-for="n in 4" :key="n" class="ui-notice-card" aria-hidden="true"><div class="ui-notice-date ui-skeleton" style="height:68px"></div><div><div class="ui-skeleton ui-skeleton-line short"></div><div class="ui-skeleton ui-skeleton-line"></div></div></article></div>
            <div v-else-if="error" class="ui-state" role="alert"><div><span class="ui-state-mark">!</span><h2>救助动态暂时无法加载</h2><p>{{ error }}</p><button class="ui-button is-dark" type="button" @click="loadNotices(pageNum)">重新加载</button></div></div>
            <div v-else-if="notices.length === 0" class="ui-state"><div><span class="ui-state-mark">⌕</span><h2>没有找到相关公告</h2><p>换一个关键词，或清除当前搜索条件。</p><button class="ui-button is-ghost" type="button" @click="resetQuery">清除搜索</button></div></div>
            <div v-else class="ui-notice-list"><article v-for="(item,index) in notices" :key="item.id" class="ui-notice-card"><div class="ui-notice-date"><strong>{{ String(index + 1).padStart(2, '0') }}</strong><span>NOTICE</span></div><div class="ui-notice-copy"><h2>{{ item.title || '未命名公告' }}</h2><p>{{ summary(item.content) }}</p></div><a class="ui-button is-ghost" :href="detailUrl(item.id)">阅读全文</a></article></div>
            <div v-if="!loading && !error && totalPages > 1" class="ui-pagination"><span>第 {{ pageNum }} 页，共 {{ total }} 条记录</span><div class="ui-page-buttons"><button type="button" :disabled="pageNum === 1" @click="loadNotices(pageNum - 1)">‹</button><button v-for="page in pageList" :key="page" type="button" :class="{ 'is-current': page === pageNum }" @click="loadNotices(page)">{{ page }}</button><button type="button" :disabled="pageNum === totalPages" @click="loadNotices(pageNum + 1)">›</button></div></div>
        </section>
    </main>
    <front-site-footer></front-site-footer>
</div>
<script src="../../js/jquery.min.js"></script><script src="../../js/vue.min.js"></script>
<script src="../../js/user-workspace.js?v=20260731a"></script>
<script src="../../js/front-shell.js?v=20260731a"></script><script src="../../js/auth-session.js?v=20260728"></script>
<script>
new Vue({
  el:'#app',data:{user:null,notices:[],query:'',loading:true,error:'',pageNum:1,pageSize:8,total:0,totalPages:1,mobileOpen:false},
  computed:{userInitial(){return this.user&&this.user.username?this.user.username.slice(0,1).toUpperCase():'↗';},pageList(){const pages=[];let start=Math.max(1,this.pageNum-2);const end=Math.min(this.totalPages,start+4);start=Math.max(1,end-4);for(let page=start;page<=end;page+=1)pages.push(page);return pages;}},
  mounted(){const start=()=>{this.user=window.AuthSession?AuthSession.getUser():null;this.loadNotices(1);};if(window.AuthSession)AuthSession.bootstrap({requireAuth:false,onDone:start});else start();},
  methods:{loadNotices(page){this.loading=true;this.error='';this.pageNum=page;$.ajax({url:'/api/notice/page',type:'GET',data:{name:this.query,pageNum:page,pageSize:this.pageSize}}).done(res=>{if(res&&res.code==='0'&&res.data){this.notices=res.data.records||[];this.total=Number(res.data.total||0);this.totalPages=Math.max(1,Number(res.data.pages||1));}else this.error=(res&&res.msg)||'服务返回了无法识别的数据';}).fail(()=>{this.error='请检查网络连接后重试。';}).always(()=>{this.loading=false;});},resetQuery(){this.query='';this.loadNotices(1);},summary(content){const text=String(content||'暂无内容').replace(/\s+/g,' ').trim();return text.length>120?text.slice(0,120)+'…':text;},detailUrl(id){return './notice_detail.html?id='+encodeURIComponent(id);}}
});
</script>
</body>
</html>
