<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="阅读归途计划公开公告详情">
    <title>公告详情 · 归途计划</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%270.9em%27 font-size=%2790%27 fill=%27%23d63a1f%27>%E2%99%A5</text></svg>">
    <link rel="stylesheet" href="../../css/product-ui.css?v=20260731a">
</head>
<body>
<div id="app" v-cloak>
    <front-site-header :user="user"></front-site-header>
    <main>
        <div v-if="loading" class="ui-article"><div class="ui-skeleton ui-skeleton-line short"></div><div class="ui-skeleton ui-skeleton-line"></div><div class="ui-skeleton ui-skeleton-line"></div></div>
        <div v-else-if="error || !notice" class="ui-container"><div class="ui-state" role="alert" style="margin:70px 0"><div><span class="ui-state-mark">!</span><h2>没有找到公告内容</h2><p>{{ error || '公告可能已经下线或不存在。' }}</p><a class="ui-button is-dark" href="./notice_list.html">返回公告中心</a></div></div></div>
        <article v-else class="ui-article"><div class="ui-breadcrumb"><a href="./notice_list.html" style="color:inherit;text-decoration:none">救助动态</a><span>/</span><strong>公告详情</strong></div><span class="ui-badge is-done">公开公告</span><h1>{{ notice.title || '未命名公告' }}</h1><p class="ui-article-meta">归途计划公开信息 · 公告编号 #{{ notice.id }}</p><div class="ui-article-body">{{ notice.content || '暂无内容' }}</div><div class="ui-detail-actions"><a class="ui-button is-dark" href="./notice_list.html">返回公告中心</a><a class="ui-button is-ghost" href="./animal_browse.html">浏览待领养动物</a></div></article>
    </main>
    <front-site-footer></front-site-footer>
</div>
<script src="../../js/jquery.min.js"></script><script src="../../js/vue.min.js"></script>
<script src="../../js/user-workspace.js?v=20260731a"></script>
<script src="../../js/front-shell.js?v=20260731a"></script><script src="../../js/auth-session.js?v=20260728"></script>
<script>
new Vue({
  el:'#app',data:{user:null,notice:null,loading:true,error:'',mobileOpen:false},
  computed:{userInitial(){return this.user&&this.user.username?this.user.username.slice(0,1).toUpperCase():'↗';}},
  mounted(){const start=()=>{this.user=window.AuthSession?AuthSession.getUser():null;this.load();};if(window.AuthSession)AuthSession.bootstrap({requireAuth:false,onDone:start});else start();},
  methods:{load(){const id=new URLSearchParams(location.search).get('id');if(!id){this.loading=false;this.error='缺少公告编号。';return;}$.ajax({url:'/api/notice/'+encodeURIComponent(id),type:'GET'}).done(res=>{if(res&&res.code==='0'&&res.data)this.notice=res.data;else this.error=(res&&res.msg)||'公告不存在。';}).fail(()=>{this.error='网络连接异常，请稍后重试。';}).always(()=>{this.loading=false;});}}
});
</script>
</body>
</html>
