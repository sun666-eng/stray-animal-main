<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册 - 流浪动物救助</title>
    <link rel="stylesheet" href="../../css/element.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/theme.css">
</head>
<body>
<div id="wrapper" v-cloak>
    <div style="width: 500px; margin: 120px auto; background-color:#b3e19d; border-radius: 10px; padding-bottom: 30px;">
        <div style="width: 100%; height: 90px; font-size: 28px;line-height: 90px; text-align: center; color: #1D4ED8">注册流浪动物救助账号</div>
        <div style="width: 60%; margin: 0 auto">
            <input v-model="user.username" type="text" style="border: 1px solid #ccc; height: 40px; padding: 10px; width: 100%" placeholder="请输入账号">
            <input v-model="user.password" type="password" style="border: 1px solid #ccc; height: 40px; padding: 10px; width: 100%; margin-top: 18px" placeholder="请输入密码">
            <input v-model="user.email" type="text" style="border: 1px solid #ccc; height: 40px; padding: 10px; width: 100%; margin-top: 18px" placeholder="请输入邮箱（可选）">
            <input v-model="user.phone" type="text" style="border: 1px solid #ccc; height: 40px; padding: 10px; width: 100%; margin-top: 18px" placeholder="请输入手机号（可选）">
            <button type="button" @click="register" :disabled="submitting" style="height: 42px; width: 100%; margin-top: 22px; background-color: #2563EB; color: white; border: 0; border-radius: 6px; cursor: pointer;">
                {{ submitting ? '注册中...' : '注册并进入用户端' }}
            </button>
            <a style="width: 100%; text-align: right; display: inline-block; margin-top: 18px; color: #1D4ED8" href="/page/front/login.html">已有账号？去登录</a>
            <a style="width: 100%; text-align: right; display: inline-block; margin-top: 10px; color: #1D4ED8" href="/page/front/animal_browse.html">先看看可领养动物</a>
        </div>
    </div>
</div>
<script src="../../js/jquery.min.js"></script>
<script src="../../js/vue.min.js"></script>
<script src="../../js/element.js"></script>
<script>
new Vue({
  el: '#wrapper',
  data: { user: {}, submitting: false },
  methods: {
    register() {
      if (!this.user.username) {
        this.$message({ message: '请输入用户名', type: 'error' });
        return;
      }
      if (!this.user.password) {
        this.$message({ message: '请输入密码', type: 'error' });
        return;
      }
      if (this.submitting) return;
      this.submitting = true;
      // 不传 role/id，服务端强制普通用户
      const payload = {
        username: this.user.username,
        password: this.user.password,
        email: this.user.email || '',
        phone: this.user.phone || ''
      };
      $.ajax({
        url: '/api/user/register',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(payload),
        timeout: 8000
      }).then(res => {
        if (res.code === '0') {
          this.$message({ message: '注册成功', type: 'success' });
          sessionStorage.setItem('user', JSON.stringify(res.data.user));
          sessionStorage.setItem('token', res.data.token);
          setTimeout(() => { location.href = '/page/end/index.html'; }, 800);
        } else {
          this.$message({ message: res.msg || '注册失败', type: 'error' });
        }
      }).fail(() => {
        this.$message({ message: '网络异常，注册失败', type: 'error' });
      }).always(() => { this.submitting = false; });
    }
  }
});
</script>
<script src="../../js/dark-mode.js"></script>
</body>
</html>
