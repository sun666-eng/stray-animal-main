<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>登录 - 流浪动物救助管理系统</title>
    <link rel="stylesheet" href="../../css/element.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #FFFBEB;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            padding: 40px 36px 32px;
        }
        .logo-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #EFF6FF;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-wrap svg { width: 72px; height: 72px; }
        h1 {
            margin: 0 0 6px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1D4ED8;
            letter-spacing: 0;
        }
        .sub {
            margin: 0 0 28px;
            text-align: center;
            font-size: 13px;
            color: #6B7280;
            line-height: 1.5;
        }
        .field { margin-bottom: 16px; }
        .field input {
            width: 100%;
            height: 44px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .code-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .code-row input { flex: 1; }
        .btn {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: 0;
            border-radius: 12px;
            background: #2563EB;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .footer a {
            color: #1D4ED8;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover { text-decoration: underline; }
        .extra {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #F3F4F6;
            text-align: center;
            font-size: 13px;
            color: #9CA3AF;
        }
        .extra a {
            display: inline-block;
            margin: 4px 8px;
            color: #6B7280;
            text-decoration: none;
        }
        .extra a:hover { color: #2563EB; }
    </style>
</head>
<body>
<div id="wrapper" class="page" v-cloak>
    <div class="card">
        <div class="logo-wrap">
            <!-- 与系统后台一致的简笔猫脸图标 -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="100" fill="#a9ddf3"/>
                <path stroke="#3A5E77" stroke-width="2.5" stroke-linecap="round" fill="#FFFFFF"
                      d="M200,158.5c0-20.2-14.8-36.5-35-36.5h-14.9V72.8c0-27.4-21.7-50.4-49.1-50.8c-28-0.5-50.9,22.1-50.9,50v50H35.8C16,122,0,138,0,157.8L0,213h200L200,158.5z"/>
                <path fill="#DDF1FA" d="M100,156.4c-22.9,0-43,11.1-54.1,27.7c15.6,10,34.2,15.9,54.1,15.9s38.5-5.8,54.1-15.9C143,167.5,122.9,156.4,100,156.4z"/>
                <circle cx="85.5" cy="78.5" r="3.5" fill="#3a5e77"/>
                <circle cx="114.5" cy="78.5" r="3.5" fill="#3a5e77"/>
                <path d="M97.7 79.9h4.7c1.9 0 3 2.2 1.9 3.7l-2.3 3.3c-.9 1.3-2.9 1.3-3.8 0l-2.3-3.3c-1.3-1.6-.2-3.7 1.8-3.7z" fill="#3a5e77"/>
            </svg>
        </div>
        <h1>流浪动物救助管理系统</h1>
        <p class="sub">用户与管理员使用同一登录入口，登录后按账号权限自动进入对应首页</p>

        <div class="field">
            <input v-model="user.username" type="text" placeholder="请输入账号" autocomplete="username">
        </div>
        <div class="field">
            <input v-model="user.password" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="field">
            <div class="code-row">
                <input v-model="user.code" type="text" placeholder="请输入验证码">
                <div id="picyzm"></div>
            </div>
        </div>

        <button type="button" class="btn" :disabled="loggingIn" @click.prevent="login">
            {{ loggingIn ? '登录中...' : '登 录' }}
        </button>

        <div class="footer">
            <a href="/page/front/register.html">注册账号</a>
            <a href="/page/front/animal_browse.html">先浏览动物</a>
        </div>

        <div class="extra">
            <a href="/page/front/my_adopt.html">我的领养</a>
            <a href="/page/front/my_volunteer.html">我的义工</a>
            <a href="/page/front/notice_list.html">公告中心</a>
            <a href="/page/front/account_public.html">信息公示</a>
        </div>
    </div>
</div>

<script src="../../js/jquery.min.js"></script>
<script src="../../js/vue.min.js"></script>
<script src="../../js/element.js"></script>
<script src="../../js/gVerify.js"></script>
<script>
var ADMIN_FLAGS = ['user','role','permission','animal','adopt','proof','visit','volunteer','account','notice','help','rescue'];
var verifyCode = null;

function hasAdminAccess(user) {
    if (!user || !Array.isArray(user.permission)) return false;
    for (var i = 0; i < user.permission.length; i++) {
        var p = user.permission[i];
        if (p && ADMIN_FLAGS.indexOf(p.flag) >= 0) return true;
    }
    return false;
}

/** 登录成功后的跳转：有 redirect 优先；否则管理员进后台，普通用户进用户端 */
function resolveHome(user) {
    var redirect = new URLSearchParams(location.search).get('redirect');
    if (redirect && redirect.indexOf('/page/') === 0) {
        // 无管理权限时不允许 redirect 进后台页面
        if (redirect.indexOf('/page/end/') === 0 && !hasAdminAccess(user)) {
            return '/page/front/animal_browse.html';
        }
        return redirect;
    }
    if (hasAdminAccess(user)) {
        return '/page/end/index.html';
    }
    return '/page/front/animal_browse.html';
}

new Vue({
    el: '#wrapper',
    data: { user: {}, loggingIn: false },
    mounted: function () {
        try {
            verifyCode = new GVerify({ id: 'picyzm', type: 'blend' });
        } catch (e) {
            verifyCode = null;
        }
    },
    methods: {
        login: function () {
            var self = this;
            if (!this.user.username) {
                this.$message({ message: '请输入账号', type: 'error' });
                return;
            }
            if (!this.user.password) {
                this.$message({ message: '请输入密码', type: 'error' });
                return;
            }
            if (!this.user.code) {
                this.$message({ message: '请输入验证码', type: 'error' });
                return;
            }
            if (verifyCode && !verifyCode.validate(this.user.code)) {
                this.$message({ message: '验证码错误', type: 'error' });
                return;
            }
            if (this.loggingIn) return;
            this.loggingIn = true;
            $.ajax({
                url: '/api/user/login',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(this.user),
                timeout: 8000
            }).then(function (res) {
                if (res.code === '0') {
                    self.$message({ message: '登录成功', type: 'success' });
                    sessionStorage.setItem('user', JSON.stringify(res.data.user));
                    sessionStorage.setItem('token', res.data.token);
                    var target = resolveHome(res.data.user);
                    setTimeout(function () { location.href = target; }, 500);
                } else {
                    self.$message({ message: res.msg || '登录失败', type: 'error' });
                }
            }).fail(function () {
                self.$message({ message: '网络异常，请稍后重试', type: 'error' });
            }).always(function () {
                self.loggingIn = false;
            });
        }
    }
});
</script>
</body>
</html>
