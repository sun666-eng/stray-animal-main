<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="流浪动物救助管理系统全界面高保真交互原型">
    <title>流浪动物救助系统 · 全界面原型</title>
    <link rel="stylesheet" href="/css/prototype.css">
    <link rel="stylesheet" href="/css/prototype-minimal.css">
</head>
<body>
<div class="prototype-studio" id="prototypeStudio">
    <aside class="studio-sidebar" aria-label="原型页面目录">
        <div class="studio-brand">
            <span class="studio-brand-mark" aria-hidden="true">P</span>
            <div>
                <strong>PAWS PROTOTYPE</strong>
                <span>高保真界面提案 v1</span>
            </div>
        </div>
        <div class="studio-search-wrap">
            <label class="sr-only" for="prototypeSearch">搜索原型页面</label>
            <input id="prototypeSearch" class="studio-search" type="search" placeholder="搜索页面或功能" autocomplete="off">
        </div>
        <nav class="studio-nav" id="prototypeNav"></nav>
        <div class="studio-legend">
            <span><i class="legend-dot public"></i>公众端</span>
            <span><i class="legend-dot member"></i>用户端</span>
            <span><i class="legend-dot admin"></i>管理端</span>
        </div>
    </aside>

    <main class="studio-main">
        <header class="studio-toolbar">
            <div class="studio-current">
                <button class="studio-icon-button sidebar-toggle" id="sidebarToggle" aria-label="切换原型目录">≡</button>
                <div>
                    <span id="currentSection">公众端</span>
                    <strong id="currentTitle">品牌首页</strong>
                </div>
            </div>
            <div class="viewport-switch" role="group" aria-label="预览尺寸">
                <button class="is-active" data-viewport="desktop">桌面</button>
                <button data-viewport="tablet">平板</button>
                <button data-viewport="mobile">手机</button>
            </div>
            <div class="studio-actions">
                <button class="studio-outline-button" id="toggleNotes">设计说明</button>
                <button class="studio-primary-button" id="openStandalone">新窗口预览</button>
            </div>
        </header>

        <section class="studio-workspace">
            <div class="preview-ruler" id="previewRuler">1440 × 自适应</div>
            <div class="preview-stage is-desktop" id="previewStage">
                <div class="prototype-app" id="prototypeApp" tabindex="-1"></div>
            </div>
        </section>
    </main>

    <aside class="studio-notes" id="studioNotes" aria-label="设计说明">
        <div class="notes-header">
            <div>
                <span>DESIGN NOTES</span>
                <strong id="notesTitle">品牌首页</strong>
            </div>
            <button id="closeNotes" aria-label="关闭设计说明">×</button>
        </div>
        <div class="notes-content" id="notesContent"></div>
    </aside>
</div>

<div class="prototype-toast" id="prototypeToast" role="status" aria-live="polite"></div>
<script src="/js/prototype.js"></script>
</body>
</html>
