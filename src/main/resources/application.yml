server:
  port: 9999
spring:
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8
    type: com.alibaba.druid.pool.DruidDataSource

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml

file:
  # 默认落到用户主目录绝对路径；相对路径会被 FileStorage 锚定到 ~/.stray-animal/
  # 生产请设置 FILE_UPLOAD_DIR=D:/data/stray-animal/upload 等固定盘符路径
  upload-dir: ${FILE_UPLOAD_DIR:${user.home}/.stray-animal/upload}
  # 可选：额外只读目录（历史静态资源）；为空则仅用 upload-dir + 开发态 static/file
  fallback-static-dir: ${FILE_FALLBACK_STATIC_DIR:}

app:
  redis:
    enabled: ${REDIS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  data-fix:
    enabled: ${DATA_FIX_ENABLED:false}
  # 启动时自动检查/补齐闭环必需库结构（pstatus、义工列、角色4、角色3的 my_proof）
  schema-guard:
    enabled: ${SCHEMA_GUARD_ENABLED:true}
    auto-migrate: ${SCHEMA_GUARD_AUTO_MIGRATE:true}
    fail-fast: ${SCHEMA_GUARD_FAIL_FAST:false}
  # 启动时打印脏数据告警（建议在 data-state-guard 之后）
  data-health:
    enabled: ${DATA_HEALTH_ENABLED:true}
  # 脏数据状态修复：待审僵尸/多通过/动物 tstate 与领养不一致
  data-state-guard:
    enabled: ${DATA_STATE_GUARD_ENABLED:true}
    auto-fix: ${DATA_STATE_GUARD_AUTO_FIX:true}
    fail-fast: ${DATA_STATE_GUARD_FAIL_FAST:false}
  # 角色/权限契约：普通用户必备闭环 flags；认证义工不得带后台权
  role-guard:
    enabled: ${ROLE_GUARD_ENABLED:true}
    auto-fix: ${ROLE_GUARD_AUTO_FIX:true}
    fail-fast: ${ROLE_GUARD_FAIL_FAST:false}
    demote-user-volunteer: ${ROLE_GUARD_DEMOTE_USER_VOLUNTEER:true}
  volunteer:
    # 义工审核通过后自动授予的角色 ID：默认 4=认证义工（无后台管理权）。
    # 旧默认 2=志愿者后台角色权限过重；设为 0 关闭自动赋权。
    auto-grant-role-id: ${VOLUNTEER_ROLE_ID:4}
