server:
  port: 9999
  servlet:
    session:
      cookie:
        http-only: true
        # 生产在 application-prod 或反向代理层再开 secure
        secure: false
        same-site: lax
spring:
  # A0.1：不再默认 dev。本地请显式：
  #   --spring.profiles.active=dev
  # 或环境变量 SPRING_PROFILES_ACTIVE=dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8
    type: com.alibaba.druid.pool.DruidDataSource

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

file:
  # 默认落到用户主目录绝对路径；相对路径会被 FileStorage 锚定到 ~/.stray-animal/
  # 生产请设置 FILE_UPLOAD_DIR=D:/data/stray-animal/upload 等固定盘符路径
  upload-dir: ${FILE_UPLOAD_DIR:${user.home}/.stray-animal/upload}
  # 可选：额外只读目录（历史静态资源）；为空则仅用 upload-dir + 开发态 static/file
  fallback-static-dir: ${FILE_FALLBACK_STATIC_DIR:}

app:
  file:
    staged-cleanup-enabled: ${FILE_STAGED_CLEANUP_ENABLED:true}
    staged-retention-hours: ${FILE_STAGED_RETENTION_HOURS:24}
    staged-cleanup-interval-ms: ${FILE_STAGED_CLEANUP_INTERVAL_MS:3600000}
    max-staged-files-per-user: ${FILE_MAX_STAGED_FILES_PER_USER:20}
    max-staged-bytes-per-user: ${FILE_MAX_STAGED_BYTES_PER_USER:104857600}
  redis:
    enabled: ${REDIS_ENABLED:false}
  # WebSocket ticket/onlineCount 为进程内状态；生产禁止水平扩容多实例
  websocket:
    single-instance-only: ${WEBSOCKET_SINGLE_INSTANCE_ONLY:true}
  jwt:
    secret: ${JWT_SECRET:}
    # 仅 active 仅为 dev/test 且本开关为 true 时可用开发密钥
    allow-dev-secret: ${JWT_ALLOW_DEV_SECRET:false}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  bootstrap:
    initial-admin-enabled: ${INITIAL_ADMIN_ENABLED:false}
    initial-admin-username: ${INITIAL_ADMIN_USERNAME:}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}
  password:
    # A2：生产务必 false；dev 可 true 以升级旧明文密码
    allow-plaintext-login: ${PASSWORD_ALLOW_PLAINTEXT:false}
  login:
    rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:8}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:300}
      lock-seconds: ${LOGIN_RATE_LIMIT_LOCK:600}
  data-fix:
    enabled: ${DATA_FIX_ENABLED:false}
  # 启动时自动检查/补齐闭环必需库结构（pstatus、义工列、角色4、角色3的 my_proof）
  schema-guard:
    enabled: ${SCHEMA_GUARD_ENABLED:true}
    auto-migrate: ${SCHEMA_GUARD_AUTO_MIGRATE:true}
    fail-fast: ${SCHEMA_GUARD_FAIL_FAST:false}
  # 启动时打印脏数据告警（建议在 data-state-guard 之后）
  data-health:
    enabled: ${DATA_HEALTH_ENABLED:true}
  # 脏数据状态修复：待审僵尸/多通过/动物 tstate 与领养不一致
  data-state-guard:
    enabled: ${DATA_STATE_GUARD_ENABLED:true}
    auto-fix: ${DATA_STATE_GUARD_AUTO_FIX:true}
    fail-fast: ${DATA_STATE_GUARD_FAIL_FAST:false}
  # 角色/权限契约：普通用户必备闭环 flags；认证义工不得带后台权
  role-guard:
    enabled: ${ROLE_GUARD_ENABLED:true}
    auto-fix: ${ROLE_GUARD_AUTO_FIX:true}
    fail-fast: ${ROLE_GUARD_FAIL_FAST:false}
    demote-user-volunteer: ${ROLE_GUARD_DEMOTE_USER_VOLUNTEER:true}
  volunteer:
    # 义工审核的派生角色同步：4=认证义工（默认），0=仅审状态且不写角色；其他正数拒绝审核。
    auto-grant-role-id: ${VOLUNTEER_ROLE_ID:4}
