# 生产 profile：禁止默认开发行为；须配合环境变量启动
# 启动：--spring.profiles.active=prod
# 必填：JWT_SECRET、AI_CONFIG_ENCRYPTION_KEY（均至少32字节且相互独立）、DB_*、FILE_UPLOAD_DIR
app:
  jwt:
    # 生产绝不允许开发密钥
    allow-dev-secret: false
    secret: ${JWT_SECRET:}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  ai:
    allow-loopback-personal-config: false
    config-encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:}
  data-fix:
    enabled: false
  schema-guard:
    enabled: true
    auto-migrate: false
    fail-fast: true
  data-health:
    enabled: true
  data-state-guard:
    enabled: true
    auto-fix: false
    fail-fast: true
  role-guard:
    enabled: true
    auto-fix: false
    fail-fast: true
  password:
    allow-plaintext-login: false
  login:
    rate-limit:
      enabled: true
      max-attempts: 8
      window-seconds: 300
      lock-seconds: 900
  bootstrap:
    # 生产首个管理员仅通过环境变量创建，见 InitialAdminBootstrap
    initial-admin-enabled: true
  health:
    db-timeout-ms: 2000
    ready-cache-ms: 3000

server:
  # 优雅关闭：让进行中的请求有界完成后再退出
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        # 生产须 HTTPS；本地误用 prod 时需反向代理 TLS
        secure: true
        same-site: lax

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # 生产建议开启 SSL（按云厂商调整）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:}?useUnicode=true&characterEncoding=utf-8&useSSL=${DB_USE_SSL:true}&serverTimezone=GMT%2b8&connectTimeout=5000&socketTimeout=60000

# 覆盖 application.yml 的 user.home 开发回退；缺失时由 DeploymentProfileGuard 拒绝启动
file:
  upload-dir: ${FILE_UPLOAD_DIR:}
